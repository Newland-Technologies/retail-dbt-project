name: Deploy dbt to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Install packages
        run: dbt deps

      - name: Validate project
        run: dbt parse

      - name: Deploy to PROD
        env:
          GOOGLE_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          # Authenticate using OIDC or service account as configured
          dbt build --target prod --profiles-dir .

